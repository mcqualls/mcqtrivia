<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Champions Gallery</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
            text-align: center;
        }
        header {
            margin-bottom: 3rem;
        }
        h1 {
            font-size: 2.5rem;
            color: #f59e0b;
            margin-bottom: 0.5rem;
        }
        p {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .photo-card {
            background-color: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }
        .photo-card:hover {
            transform: translateY(-5px);
        }
        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .caption {
            padding: 1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏆 Victory Gallery</h1>
        <p>Celebrating our championship-winning team and moments!</p>
    </header>

    <main class="gallery">
        <!-- Photo 1 -->
        <div class="photo-card">
            <img src="team-photo1.jpg" alt="Lifting the trophy">
            <div class="caption">Lifting the Trophy</div>
        </div>

        <!-- Photo 2 -->
        <div class="photo-card">
            <img src="team-photo2.jpg" alt="Team celebration">
            <div class="caption">Post-Game Celebration</div>
        </div>

        <!-- Photo 3 -->
        <div class="photo-card">
            <img src="team-photo3.jpg" alt="Game winning moment">
            <div class="caption">The Winning Moment</div>
        </div>
    </main>

</body>
</html>
